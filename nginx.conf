user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ---------------- 日志 ----------------
    # 注意：log_format 必须写在 access_log 之前
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ---------------- 基础性能 ----------------
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip            on;
    gzip_min_length 1k;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # ---------------- 基础安全 ----------------
    server_tokens off;              # 隐藏 Nginx 版本号
    client_max_body_size 10m;       # 限制请求体大小，防止大包攻击
    client_body_timeout  12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # ---------------- 限流 ----------------
    limit_req_zone  $binary_remote_addr zone=req_limit:10m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ---------------- 恶意 UA 识别 ----------------
    # 说明：map 放在 http 块，server 块里引用
    map $http_user_agent $bad_bot {
        default 0;
        ~*(nikto|sqlmap|nessus|acunetix|dirbuster) 1;
        ~*(curl|wget|python-requests|scrapy|go-http-client) 1;
        "" 1;
    }

    # ============================================================
    # HTTP -> HTTPS 强制跳转
    # ============================================================
    server {
        listen 80;
        server_name www.yblhxqh.xyz yblhxqh.xyz;

        # 拦截扫描器，避免它们在 80 端口白白探测
        if ($bad_bot) {
            return 403;
        }

        return 301 https://$host$request_uri;
    }

    # ============================================================
    # HTTPS 主站
    # ============================================================
    server {
        listen 443 ssl;
        # 若 Nginx >= 1.25.1，可改成：
        # listen 443 ssl;
        # http2 on;
        server_name www.yblhxqh.xyz yblhxqh.xyz;

        ssl_certificate     /usr/share/nginx/ssl/www.yblhxqh.xyz/server.crt;
        ssl_certificate_key /usr/share/nginx/ssl/www.yblhxqh.xyz/server.key;

        # ---------------- TLS 安全 ----------------
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        # ---------------- 安全响应头 ----------------
        add_header X-Frame-Options           SAMEORIGIN           always;
        add_header X-Content-Type-Options    nosniff              always;
        add_header X-XSS-Protection          "1; mode=block"      always;
        add_header Referrer-Policy           strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000"   always;

        # ---------------- 拦截恶意 UA ----------------
        if ($bad_bot) {
            return 403;
        }

        # ---------------- 仅允许常用请求方法 ----------------
        if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE)$) {
            return 444;
        }

        # ---------------- 拦截隐藏文件和目录 ----------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ---------------- 拦截常见敏感后缀 ----------------
        location ~* \.(env|ini|log|bak|sh|sql|yml|yaml|swp|conf|cfg)$ {
            return 403;
            log_not_found off;
        }

        # ---------------- 主站反向代理 ----------------
        location / {
            limit_req  zone=req_limit burst=20 nodelay;
            limit_conn conn_limit 20;
            limit_req_status  503;
            limit_conn_status 503;

            proxy_pass http://dnfer:8000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ---------------- 错误页 ----------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/web;
            internal;   # 只允许内部跳转，外部直接访问会被拒
        }
    }
}