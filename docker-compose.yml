services:
  dnfer:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DNFER_SECRET_KEY: ${DNFER_SECRET_KEY:?DNFER_SECRET_KEY 必须设置}
      DNFER_ADMIN_USERNAME: ${DNFER_ADMIN_USERNAME:-admin}
      DNFER_ADMIN_PASSWORD: ${DNFER_ADMIN_PASSWORD:?DNFER_ADMIN_PASSWORD 必须设置}
      DNFER_ADMIN_NICKNAME: ${DNFER_ADMIN_NICKNAME:-群主}
      DNFER_API_TOKEN: ${DNFER_API_TOKEN:?DNFER_API_TOKEN 必须设置}
      # S3 头像存储（公开读桶；留空则头像上传不可用，返回 503）
      DNFER_S3_ENDPOINT: ${DNFER_S3_ENDPOINT:-}
      DNFER_S3_ACCESS_KEY: ${DNFER_S3_ACCESS_KEY:-}
      DNFER_S3_SECRET_KEY: ${DNFER_S3_SECRET_KEY:-}
      DNFER_S3_BUCKET: ${DNFER_S3_BUCKET:-}
      DNFER_S3_REGION: ${DNFER_S3_REGION:-}
      DNFER_S3_PUBLIC_BASE: ${DNFER_S3_PUBLIC_BASE:-}
      DNFER_DATABASE_URL: sqlite:////data/dnfer.db
    volumes:
      - dnfer-data:/data
      - ./images:/app/images:ro
    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./ssl:/usr/share/nginx/ssl/
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  dnfer-data:
